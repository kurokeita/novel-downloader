[package]
name = "novel-downloader"
version = "1.1.0"
edition = "2024"
description = "Rust crawler and EPUB builder for Vietnamese web novel sites"
license = "GPL-3.0-or-later"
repository = "https://github.com/kurokeita/novel-downloader"

[lib]
name = "novel_downloader"
path = "src/lib.rs"

[[bin]]
name = "novel-downloader"
path = "src/bin/novel-downloader.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"
ego-tree = "0.11"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
zip = { version = "8", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
mime_guess = "2"
regex = "1"
html-escape = "0.2"
url = "2"
once_cell = "1"
percent-encoding = "2"
futures = "0.3"
indicatif = "0.18"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "test-util"] }
