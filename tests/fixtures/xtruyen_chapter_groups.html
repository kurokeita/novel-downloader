	`data-value` holds position bounds, not chapter numbers, and the final
	group's upper bound carries an `m` suffix meaning "and everything after".
	The child lists arrive empty; each group's chapters come from a separate
	POST to /api/api-chapters.php keyed by these bounds.
-->
